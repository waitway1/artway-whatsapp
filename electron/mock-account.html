<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp 测试视图</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #303238; background: #f5f6f7; }
      main { width: min(520px, calc(100% - 48px)); text-align: center; }
      .mark { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 8px; color: #fff; background: #cf4637; font-size: 22px; font-weight: 700; }
      h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: 0; }
      p { margin: 0; color: #6c7078; line-height: 1.6; }
      @media (prefers-color-scheme: dark) { body { color: #f1f2f3; background: #1f2023; } p { color: #a9adb5; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1 id="account">浏览器档案已隔离</h1>
      <p>这是自动化测试视图。正式运行时，此区域会打开 WhatsApp Web。</p>
    </main>
    <script>
      const name = new URLSearchParams(location.search).get("name");
      if (name) document.getElementById("account").textContent = `${name} 已独立打开`;
    </script>
  </body>
</html>
